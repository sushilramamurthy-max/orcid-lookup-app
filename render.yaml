services:
  - type: web
    name: orcid-lookup-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional -- leave blank to run in CrossRef-only mode (no signup
      # needed). Add these later, then redeploy, to widen search coverage
      # via the full ORCID registry.
      - key: ORCID_CLIENT_ID
        sync: false
      - key: ORCID_CLIENT_SECRET
        sync: false
